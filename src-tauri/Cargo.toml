[package]
name = "grindstone"
version.workspace = true
edition.workspace = true

[lib]
name = "grindstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
grind-core.workspace = true
grind-sqlite.workspace = true
grind-draft.workspace = true

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
serde_json = "1"

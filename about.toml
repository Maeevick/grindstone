# The notices of what the APK carries: the Android library and the screen's wasm, without build or test dependencies.
accepted = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	"MIT",
	"MIT-0",
	"MPL-2.0",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]
targets = ["aarch64-linux-android", "wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

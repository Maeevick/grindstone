[workspace]
resolver = "3"
members = ["core", "adapters/sqlite", "ui", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
grind-core = { path = "core" }
grind-sqlite = { path = "adapters/sqlite" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.release.package.grind-ui]
opt-level = "z"
